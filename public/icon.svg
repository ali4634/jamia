<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#022c22" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base with Rounded Corner (Android & PWA Safe Area) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Ornamental Gold Border -->
  <rect x="28" y="28" width="456" height="456" rx="90" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.8" />
  
  <!-- Islamic Arch Silhouette -->
  <path d="M 120 400 L 120 250 C 120 160 256 100 256 100 C 256 100 392 160 392 250 L 392 400 Z" fill="#022c22" fill-opacity="0.35" />

  <!-- Dome Top Minaret Finial / Crescent -->
  <g transform="translate(256, 118)" filter="url(#shadow)">
    <!-- Crescent Moon -->
    <path d="M 0,-25 A 18,18 0 1,1 -12,4 A 14,14 0 1,0 0,-25 Z" fill="url(#goldGrad)" />
    <!-- Center Star / Finial -->
    <circle cx="0" cy="10" r="3" fill="url(#goldGrad)" />
  </g>

  <!-- Ledger & Quran Book Representation (Open Book) -->
  <g filter="url(#shadow)" transform="translate(0, 30)">
    <!-- Book Spine & Shadow Base -->
    <path d="M 256 320 L 256 348 C 210 338 150 340 100 360 L 100 332 C 150 312 210 310 256 320 Z" fill="#0f172a" opacity="0.4"/>
    <path d="M 256 320 L 256 348 C 302 338 362 340 412 360 L 412 332 C 362 312 302 310 256 320 Z" fill="#0f172a" opacity="0.4"/>

    <!-- Left Page -->
    <path d="M 256 220 C 205 208 145 212 96 235 L 96 335 C 145 312 205 308 256 320 Z" fill="url(#pageGrad)" stroke="#cbd5e1" stroke-width="2" />
    <!-- Right Page -->
    <path d="M 256 220 C 307 208 367 212 416 235 L 416 335 C 367 312 307 308 256 320 Z" fill="url(#pageGrad)" stroke="#cbd5e1" stroke-width="2" />

    <!-- Center Binding Line -->
    <line x1="256" y1="218" x2="256" y2="322" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />

    <!-- Ledger Lines Left Page (Financial Entry Lines) -->
    <line x1="126" y1="255" x2="230" y2="243" stroke="#059669" stroke-width="3.5" stroke-linecap="round" />
    <line x1="130" y1="275" x2="230" y2="263" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="134" y1="295" x2="230" y2="283" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="138" y1="315" x2="230" y2="303" stroke="#059669" stroke-width="3" stroke-linecap="round" />

    <!-- Ledger Lines Right Page (Financial Entry Lines) -->
    <line x1="282" y1="243" x2="386" y2="255" stroke="#d97706" stroke-width="3.5" stroke-linecap="round" />
    <line x1="282" y1="263" x2="382" y2="275" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="282" y1="283" x2="378" y2="295" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="282" y1="303" x2="374" y2="315" stroke="#d97706" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Scale / Balance of Justice Motif (Mizan) in Center -->
  <g transform="translate(256, 185)" filter="url(#shadow)">
    <!-- Center Beam -->
    <line x1="-38" y1="0" x2="38" y2="0" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    <!-- Center Post -->
    <line x1="0" y1="-8" x2="0" y2="18" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    <!-- Center Ring -->
    <circle cx="0" cy="-8" r="4" fill="url(#goldGrad)" />
    <!-- Left Pan -->
    <path d="M -48,22 Q -38,30 -28,22 Z" fill="url(#goldGrad)" />
    <line x1="-38" y1="0" x2="-48" y2="22" stroke="url(#goldGrad)" stroke-width="1.5" />
    <line x1="-38" y1="0" x2="-28" y2="22" stroke="url(#goldGrad)" stroke-width="1.5" />
    <!-- Right Pan -->
    <path d="M 28,22 Q 38,30 48,22 Z" fill="url(#goldGrad)" />
    <line x1="38" y1="0" x2="28" y2="22" stroke="url(#goldGrad)" stroke-width="1.5" />
    <line x1="38" y1="0" x2="48" y2="22" stroke="url(#goldGrad)" stroke-width="1.5" />
  </g>
</svg>
